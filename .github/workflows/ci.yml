name: RiftTrace CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true


jobs:
  backend:
    name: Backend quality

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci

      DJANGO_SECRET_KEY: >-
        rifttrace-ci-only-secret-key-not-for-production

      SECRET_KEY: >-
        rifttrace-ci-only-secret-key-not-for-production

      DJANGO_ALLOWED_HOSTS: >-
        localhost,127.0.0.1,testserver

      POSTGRES_DB: rifttrace_ci
      POSTGRES_USER: rifttrace
      POSTGRES_PASSWORD: rifttrace
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

      DB_NAME: rifttrace_ci
      DB_USER: rifttrace
      DB_PASSWORD: rifttrace
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      DATABASE_URL: >-
        postgresql://rifttrace:rifttrace@127.0.0.1:5432/rifttrace_ci

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: rifttrace_ci
          POSTGRES_USER: rifttrace
          POSTGRES_PASSWORD: rifttrace

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready
          -U rifttrace
          -d rifttrace_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend CI
        run: |
          ./scripts/ci_backend.sh

      - name: Validate production deployment
        run: |
          ./scripts/deployment_quality_gate.sh

  frontend:
    name: Frontend quality

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      VITE_API_BASE_URL: /api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7

        with:
          node-version: "22"

          cache: npm

          cache-dependency-path: >-
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend

        run: npm ci

      - name: Run frontend quality gate
        run: |
          ./scripts/frontend_quality_gate.sh
