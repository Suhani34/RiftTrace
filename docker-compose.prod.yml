services:
  db:
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - ${RIFTTRACE_ENV_FILE:-.env.prod}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]

      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  migrate:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile

    env_file:
      - ${RIFTTRACE_ENV_FILE:-.env.prod}

    environment:
      POSTGRES_HOST: db

    command:
      [
        "python",
        "manage.py",
        "migrate",
        "--noinput",
      ]

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile

    restart: unless-stopped

    env_file:
      - ${RIFTTRACE_ENV_FILE:-.env.prod}

    environment:
      POSTGRES_HOST: db

    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind=0.0.0.0:8000",
        "--workers=2",
        "--timeout=60",
        "--graceful-timeout=30",
        "--error-logfile=-",
        "--capture-output",
      ]

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=5)",
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile

      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1",
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data:
