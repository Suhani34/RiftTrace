map $http_x_forwarded_proto $rifttrace_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}


server {
    listen 80;
    server_name _;


    root /usr/share/nginx/html;
    index index.html;


    client_max_body_size 5m;


    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        X-Frame-Options
        "DENY"
        always;

    add_header
        Referrer-Policy
        "same-origin"
        always;


    location = /healthz {
        access_log off;

        default_type text/plain;

        return 200 "ok\n";
    }


    location /api/ {
        proxy_pass
            http://backend:8000;

        proxy_http_version
            1.1;

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $rifttrace_proto;

        proxy_set_header
            X-Request-ID
            $request_id;

        proxy_connect_timeout
            10s;

        proxy_read_timeout
            60s;
    }


    location /assets/ {
        try_files
            $uri
            =404;

        expires
            1y;

        add_header
            Cache-Control
            "public, immutable";
    }


    location / {
        try_files
            $uri
            $uri/
            /index.html;
    }
}
